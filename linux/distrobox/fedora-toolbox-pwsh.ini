[ftb-pwsh]
image=quay.io/fedora/fedora-toolbox:44
pre_init_hooks=curl -sSL -O https://packages.microsoft.com/config/rhel/9/packages-microsoft-prod.rpm;
pre_init_hooks=dnf -y install packages-microsoft-prod.rpm;
pre_init_hooks=rm packages-microsoft-prod.rpm;
additional_packages="powershell"
init_hooks=export SHELL=/usr/bin/pwsh;
volume="/var/users:/var/users"
exported_bins="/usr/bin/pwsh"
